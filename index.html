<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK1 Flashcards</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ebe4d7;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    .menu-container {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .menu-btn {
        background-color: #d6c8b4;
        color: #6b4e2e;
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    .flashcard-container {
        perspective: 1000px;
        margin: 0 auto 30px auto;
        width: 280px;
        height: 180px;
    }

    .flashcard {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
    }

    .flashcard.flipped {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    .front { font-size: 36px; }
    .back { transform: rotateY(180deg); }

    .back .pinyin {
        color: red;
        font-size: 24px;
        margin-bottom: 6px;
    }

    .back .meaning {
        font-size: 20px;
    }

    .control-container {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-top: 40px;
    }

    .nav-btn, .speak-btn {
        width: 55px;
        height: 55px;
        border-radius: 50%;
        border: none;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .nav-btn { background-color: #d6c8b4; }
    .speak-btn { background-color: #ffb347; }

    .elizabeth {
        width: 35%;
        max-width: 120px;
        margin: 20px auto 0;
        display: block;
        transition: transform 0.6s;
        transform-style: preserve-3d;
    }

    .elizabeth.flipped {
        transform: rotateY(180deg);
    }
</style>

<script src="data.js"></script>
</head>

<body>

<div class="menu-container">
    <button class="menu-btn" onclick="setMode('vocab')">TỪ VỰNG</button>
    <button class="menu-btn" onclick="setMode('sentences')">CÂU THOẠI</button>
    <button class="menu-btn" onclick="setMode('all')">TẤT CẢ</button>
</div>

<div class="flashcard-container">
    <div id="flashcard" class="flashcard" onclick="flipCard()">
        <div id="front" class="front"></div>
        <div id="back" class="back"></div>
    </div>
</div>

<div class="control-container">
    <button class="nav-btn" onclick="prevCard()">&#8592;</button>
    <button class="speak-btn" onclick="speakCurrent()">🔊</button>
    <button class="nav-btn" onclick="nextCard()">&#8594;</button>
</div>

<img src="Elizabeth.png" class="elizabeth" id="elizabeth">

<script>
let mode = "vocab";
let currentList = [];
let history = [];
let historyIndex = -1;

/* RANDOM – KHÔNG TRÙNG THẺ GẦN NHẤT */
function getRandomItem(list) {
    if (list.length <= 1) return list[0];

    let item;
    const lastItem = history[historyIndex];

    do {
        item = list[Math.floor(Math.random() * list.length)];
    } while (item === lastItem);

    return item;
}

/* SET MODE */
function setMode(m) {
    mode = m;

    if (mode === "vocab") currentList = vocabList;
    else if (mode === "sentences") currentList = sentenceList;
    else currentList = vocabList.concat(sentenceList);

    history = [];
    historyIndex = -1;
    nextCard(); // random thẻ đầu tiên
}

/* RENDER */
function renderCard(item) {
    document.getElementById("front").textContent = item.hanzi;
    document.getElementById("back").innerHTML = `
        <div class="pinyin">${item.pinyin}</div>
        <div class="meaning">${item.mean}</div>
    `;
    document.getElementById("flashcard").classList.remove("flipped");
    document.getElementById("elizabeth").classList.remove("flipped");
}

/* NEXT → RANDOM MỚI */
function nextCard() {
    const item = getRandomItem(currentList);
    history = history.slice(0, historyIndex + 1);
    history.push(item);
    historyIndex++;
    renderCard(item);
}

/* PREV → QUAY LẠI */
function prevCard() {
    if (historyIndex > 0) {
        historyIndex--;
        renderCard(history[historyIndex]);
    }
}

/* FLIP */
function flipCard() {
    document.getElementById("flashcard").classList.toggle("flipped");
    document.getElementById("elizabeth").classList.toggle("flipped");
}

/* SPEAK */
function speakCurrent() {
    const item = history[historyIndex];
    if (!item) return;
    const utter = new SpeechSynthesisUtterance(item.hanzi);
    utter.lang = "zh-CN";
    speechSynthesis.speak(utter);
}

/* INIT */
setMode("vocab");
</script>

</body>
</html>
