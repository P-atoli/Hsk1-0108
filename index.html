<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK 1 - Flashcards chuẩn Google</title>
    <style>
        :root { --primary: #c0392b; --secondary: #2c3e50; --bg: #f5f6fa; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .mode-selector { display: flex; gap: 8px; margin: 20px 0; }
        .btn-mode { padding: 10px 18px; border: none; border-radius: 20px; cursor: pointer; background: #dcdde1; font-weight: bold; transition: 0.3s; }
        .btn-mode.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(192, 57, 43, 0.3); }
        .card-container { width: 340px; height: 240px; perspective: 1000px; margin-bottom: 30px; }
        .flashcard { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; border-radius: 20px; padding: 20px; box-sizing: border-box; }
        .back { transform: rotateY(180deg); background: #fffdf5; border: 2px solid var(--primary); }
        .hanzi { font-size: 3.8rem; color: var(--primary); font-weight: bold; margin-bottom: 10px; }
        .pinyin { font-size: 1.6rem; color: #2980b9; margin-bottom: 8px; }
        .meaning { font-size: 1.3rem; color: var(--secondary); text-align: center; line-height: 1.4; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; width: 340px; }
        .btn-tool { padding: 14px; border: none; border-radius: 15px; cursor: pointer; font-weight: bold; color: white; display: flex; flex-direction: column; align-items: center; gap: 5px; transition: 0.2s; }
        .btn-flip { background: #f1c40f; color: #333; }
        .btn-speak { background: #2ecc71; }
        .btn-next { background: #3498db; }
        .btn-tool:active { transform: scale(0.95); }
        .counter { margin-top: 20px; color: #7f8c8d; font-weight: bold; font-size: 1rem; }
        audio { display: none; }
    </style>
</head>
<body>

    <h1 style="color: var(--secondary);">HSK 1 - ÔN TẬP TỔNG HỢP</h1>

    <div class="mode-selector">
        <button class="btn-mode" onclick="setMode('vocab')">Từ vựng</button>
        <button class="btn-mode" onclick="setMode('sentence')">Câu</button>
        <button class="btn-mode active" onclick="setMode('all')">Tất cả</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="flashcard" id="flashcard">
            <div class="face front">
                <div class="hanzi" id="front-hanzi">...</div>
                <div style="color: #bdc3c7; font-size: 0.8rem;">(Chạm để lật)</div>
            </div>
            <div class="face back">
                <div class="hanzi" id="back-hanzi-small" style="font-size: 1.8rem; margin-bottom: 15px;">...</div>
                <div class="pinyin" id="back-pinyin">...</div>
                <div class="meaning" id="back-meaning">...</div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-tool btn-flip" onclick="flipCard(); event.stopPropagation();">🔄 Lật</button>
        <button class="btn-tool btn-speak" onclick="speakGoogle(); event.stopPropagation();">🔊 Phát âm</button>
        <button class="btn-tool btn-next" onclick="nextCard(); event.stopPropagation();">➡ Tiếp</button>
    </div>

    <div class="counter" id="counter">0 / 0</div>

    <audio id="google-audio"></audio>

    <script>
        const database = [
            // BÀI 1 - 5
            { type: 'vocab', hanzi: '你', pinyin: 'nǐ', viet: 'Bạn, anh, chị' },
            { type: 'vocab', hanzi: '好', pinyin: 'hǎo', viet: 'Tốt, khỏe' },
            { type: 'vocab', hanzi: '您', pinyin: 'nín', viet: 'Ngài, ông (kính ngữ)' },
            { type: 'vocab', hanzi: '老师', pinyin: 'lǎoshī', viet: 'Giáo viên' },
            { type: 'vocab', hanzi: '学生', pinyin: 'xuésheng', viet: 'Học sinh' },
            { type: 'vocab', hanzi: '中国人', pinyin: 'Zhōngguó rén', viet: 'Người Trung Quốc' },
            { type: 'sentence', hanzi: '你好！', pinyin: 'Nǐ hǎo!', viet: 'Xin chào!' },
            { type: 'sentence', hanzi: '你叫什么名字？', pinyin: 'Nǐ jiào shénme míngzi?', viet: 'Bạn tên là gì?' },
            
            // BÀI 6 - 10
            { type: 'vocab', hanzi: '会', pinyin: 'huì', viet: 'Biết (qua học tập)' },
            { type: 'vocab', hanzi: '做', pinyin: 'zuò', viet: 'Làm, nấu ăn' },
            { type: 'vocab', hanzi: '汉字', pinyin: 'Hànzì', viet: 'Chữ Hán' },
            { type: 'vocab', hanzi: '好吃', pinyin: 'hǎochī', viet: 'Ngon' },
            { type: 'vocab', hanzi: '商店', pinyin: 'shāngdiàn', viet: 'Cửa hàng' },
            { type: 'vocab', hanzi: '多少', pinyin: 'duōshao', viet: 'Bao nhiêu' },
            { type: 'vocab', hanzi: '杯子', pinyin: 'bēizi', viet: 'Cái cốc' },
            { type: 'sentence', hanzi: '我会说汉语。', pinyin: 'Wǒ huì shuō Hànyǔ.', viet: 'Tôi biết nói tiếng Trung.' },
            { type: 'sentence', hanzi: '这个杯子多少钱？', pinyin: 'Zhège bēizi duōshao qián?', viet: 'Cái cốc này bao nhiêu tiền?' },

            // BÀI 11 - 15
            { type: 'vocab', hanzi: '现在', pinyin: 'xiànzài', viet: 'Bây giờ' },
            { type: 'vocab', hanzi: '点', pinyin: 'diǎn', viet: 'Giờ' },
            { type: 'vocab', hanzi: '漂亮', pinyin: 'piàoliang', viet: 'Xinh đẹp' },
            { type: 'vocab', hanzi: '天气', pinyin: 'tiānqì', viet: 'Thời tiết' },
            { type: 'vocab', hanzi: '下雨', pinyin: 'xià yǔ', viet: 'Mưa' },
            { type: 'vocab', hanzi: '认识', pinyin: 'rènshi', viet: 'Quen biết' },
            { type: 'sentence', hanzi: '现在几点？', pinyin: 'Xiànzài jǐ diǎn?', viet: 'Bây giờ là mấy giờ?' },
            { type: 'sentence', hanzi: '很高兴认识你。', pinyin: 'Hěn gāoxìng rènshi nǐ.', viet: 'Rất vui được làm quen.' },

            // BÀI 16 (SỐ ĐẾM)
            { type: 'vocab', hanzi: '零', pinyin: 'líng', viet: 'Số 0' },
            { type: 'vocab', hanzi: '一', pinyin: 'yī', viet: 'Số 1' },
            { type: 'vocab', hanzi: '十五', pinyin: 'shíwǔ', viet: 'Số 15' },
            { type: 'vocab', hanzi: '二百', pinyin: 'èrbǎi', viet: 'Số 200' },
            { type: 'vocab', hanzi: '一千', pinyin: 'yìqiān', viet: 'Một nghìn' },
            { type: 'vocab', hanzi: '一百万', pinyin: 'yībǎi wàn', viet: 'Một triệu' },
            { type: 'vocab', hanzi: '十亿', pinyin: 'shí yì', viet: 'Một tỉ' }
        ];

        let currentData = [];
        let index = 0;

        function setMode(mode) {
            document.querySelectorAll('.btn-mode').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            currentData = mode === 'all' ? [...database] : database.filter(i => i.type === mode);
            currentData.sort(() => Math.random() - 0.5);
            index = 0;
            render();
        }

        function render() {
            const item = currentData[index];
            document.getElementById('front-hanzi').innerText = item.hanzi;
            document.getElementById('back-hanzi-small').innerText = item.hanzi;
            document.getElementById('back-pinyin').innerText = item.pinyin;
            document.getElementById('back-meaning').innerText = item.viet;
            document.getElementById('counter').innerText = `${index + 1} / ${currentData.length}`;
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() {
            document.getElementById('flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            index = (index + 1) % currentData.length;
            render();
        }

        // --- HÀM PHÁT ÂM GOOGLE ---
        function speakGoogle() {
            const text = currentData[index].hanzi;
            const audio = document.getElementById('google-audio');
            // Sử dụng URL Google Translate TTS (giọng Quan Thoại - zh-CN)
            const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=zh-CN&client=tw-ob`;
            
            audio.src = url;
            audio.play().catch(e => {
                console.error("Lỗi phát âm: ", e);
                alert("Hãy thử lại hoặc kiểm tra kết nối mạng!");
            });
        }

        window.onload = () => setMode('all');
    </script>
</body>
</html>
