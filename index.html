<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK1 Flashcards</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f5f5;
        margin: 0;
        padding: 20px;
        text-align: center;
    }
    h1 { font-size: 26px; margin-bottom: 20px; }

    .menu {
        margin-bottom: 20px;
    }
    .menu button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        background: #007bff;
        color: white;
        border-radius: 6px;
    }
    .menu button:hover {
        background: #0056b3;
    }

    .card-container {
        perspective: 1000px;
        width: 90%;
        max-width: 380px;
        margin: 20px auto;
    }
    .card {
        width: 100%;
        height: 220px;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
        cursor: pointer;
    }
    .card.flip {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px;
        border-radius: 10px;
        font-size: 30px;
        background: white;
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .back {
        transform: rotateY(180deg);
        font-size: 20px;
        line-height: 1.4;
    }

    .controls {
        margin-top: 20px;
    }
    .controls button {
        padding: 10px 15px;
        margin: 5px;
        font-size: 16px;
        border: none;
        cursor: pointer;
        background: #28a745;
        color: white;
        border-radius: 6px;
    }
    .controls button:hover {
        background: #1e7e34;
    }

    .audio-btn {
        margin-top: 10px;
        background: #ff5722 !important;
    }
</style>

</head>
<body>

<h1>HSK1 Flashcards</h1>

<div class="menu">
    <button onclick="setMode('vocab')">TỪ VỰNG</button>
    <button onclick="setMode('sentences')">CÂU THOẠI</button>
    <button onclick="setMode('all')">TẤT CẢ</button>
</div>

<div class="card-container" onclick="flipCard()">
    <div class="card" id="flashcard">
        <div class="front" id="card-front">加载中...</div>
        <div class="back" id="card-back">加载中...</div>
    </div>
</div>

<div class="controls">
    <button onclick="previousCard()">Quay lại</button>
    <button onclick="nextCard()">Tiếp theo</button>
    <button class="audio-btn" onclick="speakCurrent()">🔊 Phát âm</button>
</div>

<script src="data.js"></script>

<script>
let mode = "vocab";
let currentIndex = 0;
let currentList = [];

function setMode(m) {
    mode = m;
    buildList();
    currentIndex = 0;
    displayCard();
}

// gộp dữ liệu theo mode
function buildList() {
    if (mode === "vocab") currentList = vocabList;
    else if (mode === "sentences") currentList = sentenceList;
    else currentList = vocabList.concat(sentenceList);

    shuffle(currentList);
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function displayCard() {
    const item = currentList[currentIndex];
    document.getElementById("card-front").innerHTML = item.hanzi;
    document.getElementById("card-back").innerHTML = item.pinyin + "<br>" + item.mean;
}

// lật thẻ
function flipCard() {
    document.getElementById("flashcard").classList.toggle("flip");
}

function nextCard() {
    currentIndex++;
    if (currentIndex >= currentList.length) currentIndex = 0;
    document.getElementById("flashcard").classList.remove("flip");
    displayCard();
}

function previousCard() {
    currentIndex--;
    if (currentIndex < 0) currentIndex = currentList.length - 1;
    document.getElementById("flashcard").classList.remove("flip");
    displayCard();
}

function speakCurrent() {
    const utter = new SpeechSynthesisUtterance();
    utter.text = currentList[currentIndex].hanzi;
    utter.lang = "zh-CN";
    utter.rate = 0.9;
    speechSynthesis.speak(utter);
}

// khởi tạo
buildList();
displayCard();
</script>

</body>
</html>
