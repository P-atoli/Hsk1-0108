<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HSK1 Flashcards</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #ebe4d7;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    /* MENU TRÊN */
    .menu-container {
        margin-bottom: 20px;
        display: flex;
        justify-content: center;
        gap: 12px;
    }

    .menu-btn {
        background-color: #d6c8b4;
        color: #6b4e2e;
        padding: 10px 18px;
        border-radius: 8px;
        border: none;
        font-weight: bold;
        cursor: pointer;
    }

    /* FLASHCARD */
    .flashcard-container {
        perspective: 1000px;
        margin: 0 auto 30px auto;
        width: 280px;
        height: 180px;
    }

    .flashcard {
        width: 100%;
        height: 100%;
        background: white;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 32px;
        color: black;
        cursor: pointer;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
    }

    .flashcard.flipped {
        transform: rotateY(180deg);
    }

    .front, .back {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        padding: 15px;
        box-sizing: border-box;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
    }

    .front {
        color: black;
        font-size: 36px;
    }

    .back .pinyin {
        color: red;
        font-size: 24px;
        margin-bottom: 6px;
    }

    .back .meaning {
        color: black;
        font-size: 20px;
    }

    .back {
        transform: rotateY(180deg);
    }

    /* NÚT DƯỚI */
    .control-container {
        display: flex;
        justify-content: center;
        gap: 25px;
        margin-top: 40px;
        margin-bottom: 30px;
    }

    .nav-btn {
        width: 55px;
        height: 55px;
        background-color: #d6c8b4;
        border-radius: 50%;
        border: none;
        font-size: 28px;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
    }

    .speak-btn {
        width: 55px;
        height: 55px;
        background-color: #ffb347;
        border-radius: 50%;
        border: none;
        font-size: 28px;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Elizabeth */
    .elizabeth {
        width: 35%;
        max-width: 120px;
        margin: 20px auto 0 auto;
        display: block;
    }

    /* Animation rung cute */
    @keyframes shakeCute {
        0% { transform: translateX(0); }
        20% { transform: translateX(-4px); }
        40% { transform: translateX(4px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
        100% { transform: translateX(0); }
    }

    .elizabeth.shake {
        animation: shakeCute 0.4s ease-in-out;
    }
</style>

<script src="data.js"></script>
</head>

<body>

<!-- MENU TRÊN -->
<div class="menu-container">
    <button class="menu-btn" onclick="setMode('vocab')">TỪ VỰNG</button>
    <button class="menu-btn" onclick="setMode('sentences')">CÂU THOẠI</button>
    <button class="menu-btn" onclick="setMode('all')">TẤT CẢ</button>
</div>

<!-- FLASHCARD -->
<div class="flashcard-container">
    <div id="flashcard" class="flashcard" onclick="flipCard()">
        <div id="front" class="front"></div>
        <div id="back" class="back"></div>
    </div>
</div>

<!-- NÚT ĐIỀU KHIỂN -->
<div class="control-container">
    <button class="nav-btn" onclick="prevCard()">&#8592;</button>
    <button class="speak-btn" onclick="speakCurrent()">🔊</button>
    <button class="nav-btn" onclick="nextCard()">&#8594;</button>
</div>

<!-- HÌNH ELIZABETH -->
<img src="Elizabeth.png" class="elizabeth" id="elizabeth">

<script>
let mode = "vocab";
let currentIndex = 0;
let currentList = [];

/* ĐỔI CHẾ ĐỘ */
function setMode(m) {
    mode = m;

    if (mode === "vocab") currentList = vocabList;
    else if (mode === "sentences") currentList = sentenceList;
    else currentList = vocabList.concat(sentenceList);

    currentIndex = 0;
    renderCard();
}

/* HIỆU ỨNG LẬT THẺ + RUNG HÌNH */
function flipCard() {
    const card = document.getElementById("flashcard");
    const eliza = document.getElementById("elizabeth");

    card.classList.toggle("flipped");

    eliza.classList.add("shake");
    setTimeout(() => eliza.classList.remove("shake"), 450);
}

/* HIỂN THỊ THẺ */
function renderCard() {
    const item = currentList[currentIndex];

    document.getElementById("front").textContent = item.word;
    document.getElementById("back").innerHTML =
        `<div class="pinyin">${item.pinyin}</div>
         <div class="meaning">${item.meaning}</div>`;

    document.getElementById("flashcard").classList.remove("flipped");
}

/* ĐIỀU HƯỚNG */
function nextCard() {
    currentIndex = (currentIndex + 1) % currentList.length;
    renderCard();
}

function prevCard() {
    currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
    renderCard();
}

/* PHÁT ÂM */
function speakCurrent() {
    const item = currentList[currentIndex];
    const utter = new SpeechSynthesisUtterance(item.word);
    utter.lang = "zh-CN";
    speechSynthesis.speak(utter);
}

/* KHỞI TẠO */
setMode("vocab");
</script>

</body>
</html>
