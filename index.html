    <meta charset="UTF-8">

    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #f5f5f5;
            --text-color: #333;
            --card-bg: #ffffff;
            --font-main: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: #eef2f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: var(--text-color);
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.5rem;
        }

        /* Mode Buttons */
        .mode-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn-mode {
            padding: 8px 16px;
            border: 1px solid var(--primary-color);
            background: white;
            color: var(--primary-color);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .btn-mode.active {
            background: var(--primary-color);
            color: white;
        }

        /* Flashcard Container */
        .card-container {
            perspective: 1000px;
            width: 90%;
            max-width: 400px;
            height: 300px;
            margin-bottom: 30px;
            cursor: pointer;
        }

        .flashcard {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 15px;
            background: var(--card-bg);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Front Face */
        .card-front {
            background-color: #fff;
            color: #333;
        }

        .hanzi {
            font-size: 3.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .hint {
            font-size: 0.9rem;
            color: #888;
            margin-top: 20px;
        }

        /* Back Face */
        .card-back {
            background-color: #fffaf0;
            transform: rotateY(180deg);
            border: 2px solid var(--primary-color);
        }

        .pinyin {
            font-size: 1.5rem;
            color: #d35400;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .meaning {
            font-size: 1.2rem;
            color: #2c3e50;
            line-height: 1.4;
        }

        /* Action Buttons */
        .action-controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        .btn-action {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-flip { background-color: #f1c40f; color: #333; }
        .btn-speak { background-color: #2ecc71; color: white; }
        .btn-next { background-color: #3498db; color: white; }

        .btn-action:hover { opacity: 0.9; }
        .btn-action:active { transform: scale(0.98); }

        /* Counter */
        .counter {
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }

    </style>
</head>

    let currentList = [];
    let currentIndex = 0;
    let isFlipped = false;
    let currentMode = 'all';

    // Xáo trộn mảng (Fisher-Yates Shuffle)
    function shuffle(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex != 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function setMode(mode) {
        currentMode = mode;
        
        // Update button UI
        document.querySelectorAll('.btn-mode').forEach(btn => btn.classList.remove('active'));
        if(mode === 'vocab') document.querySelectorAll('.btn-mode')[0].classList.add('active');
        else if(mode === 'sentence') document.querySelectorAll('.btn-mode')[1].classList.add('active');
        else document.querySelectorAll('.btn-mode')[2].classList.add('active');

        // Filter Data
        if (mode === 'all') {
            currentList = [...database];
        } else {
            currentList = database.filter(item => item.type === mode);
        }

        // Shuffle and Reset
        currentList = shuffle(currentList);
        currentIndex = 0;
        resetCardState();
        renderCard();
    }

    function resetCardState() {
        isFlipped = false;
        document.getElementById('flashcard').classList.remove('flipped');
    }

    function renderCard() {
        if (currentList.length === 0) return;
        
        const item = currentList[currentIndex];
        document.getElementById('card-hanzi').innerText = item.hanzi;
        document.getElementById('card-hanzi-back').innerText = item.hanzi;
        document.getElementById('card-pinyin').innerText = item.pinyin;
        document.getElementById('card-meaning').innerText = item.viet;

        // Auto speak if flipped? No, user requested manual button or auto on flip?
        // User requested: "Tự động đọc khi bấm nút" -> Manual button trigger.
        
        updateCounter();
    }

    function updateCounter() {
        document.getElementById('counter').innerText = `${currentIndex + 1} / ${currentList.length}`;
    }

    function flipCard() {
        isFlipped = !isFlipped;
        const card = document.getElementById('flashcard');
        if (isFlipped) {
            card.classList.add('flipped');
        } else {
            card.classList.remove('flipped');
        }
    }

    function nextCard() {
        // Go to next, loop back to start if end
        currentIndex = (currentIndex + 1) % currentList.length;
        resetCardState();
        setTimeout(renderCard, 200); // Wait for flip back animation slightly
    }

    function speakText() {
        if (currentList.length === 0) return;
        const text = currentList[currentIndex].hanzi;
        
        // Web Speech API
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN'; // Set language to Chinese
        utterance.rate = 0.8; // Slightly slower for learning
        window.speechSynthesis.speak(utterance);
    }

    // Initialize
    window.onload = function() {
        setMode('all');
    };
